spring.application.name=speaking

# Postgres (Docker: docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5433/peerup
spring.datasource.username=peerup
spring.datasource.password=peerup

# Flyway owns the schema; Hibernate only validates against it
spring.jpa.hibernate.ddl-auto=validate

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Show db + redis sub-status at /actuator/health
management.endpoint.health.show-details=always
