spring.application.name=speaking
server.port=${PORT:8080}

# Postgres (Docker: docker compose up -d)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/peerup}
spring.datasource.username=${DATABASE_USERNAME:peerup}
spring.datasource.password=${DATABASE_PASSWORD:peerup}

# Flyway owns the schema; Hibernate only validates against it
spring.jpa.hibernate.ddl-auto=validate

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Show db + redis sub-status at /actuator/health
management.endpoint.health.show-details=always

# App JWT. Dev secret only; prod overrides via APP_JWT_SECRET env var. HS256 needs >=32 bytes.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-0123456789-0123456789-0123456789}
app.jwt.access-ttl=P15D
app.jwt.refresh-ttl=P30D

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:postmessage}
app.google.token-uri=https://oauth2.googleapis.com/token

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# STUN is free/public. TURN is optional: set secret+url to enable relay (coturn REST auth).
app.turn.stun-url=${TURN_STUN_URL:stun:stun.l.google.com:19302}
app.turn.url=${TURN_URL:}
app.turn.secret=${TURN_SECRET:}
app.turn.username=${TURN_USERNAME:}
app.turn.credential=${TURN_CREDENTIAL:}
app.turn.ttl-seconds=${TURN_TTL_SECONDS:86400}
app.metered.domain=${METERED_DOMAIN:speaking.metered.live}
app.metered.secret=${METERED_SECRET_KEY:}
